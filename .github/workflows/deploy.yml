name: Refresh orbital data & deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */2 * * *'   # CelesTrak updates GP data about every 2 hours
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch TLE snapshot from CelesTrak
        run: |
          mkdir -p _site/data
          cp index.html README.md _site/
          touch _site/.nojekyll
          groups="active stations visual last-30-days starlink oneweb iridium-NEXT planet gps-ops galileo glo-ops beidou geo weather resource science military cubesat amateur cosmos-1408-debris fengyun-1c-debris iridium-33-debris cosmos-2251-debris"
          ok=""
          for g in $groups; do
            f="_site/data/$g.txt"
            if curl -fsS --retry 3 --retry-delay 5 -A "OrbitalWatch SSA (github.com/${{ github.repository }})" \
                 "https://celestrak.org/NORAD/elements/gp.php?GROUP=$g&FORMAT=tle" -o "$f" && grep -q '^1 ' "$f"; then
              ok="$ok\"$g\","
              echo "ok   $g ($(grep -c '^1 ' "$f") objects)"
            else
              rm -f "$f"; echo "skip $g"
            fi
            sleep 1
          done
          printf '{"t":%s,"groups":[%s]}\n' "$(date -u +%s)" "${ok%,}" > _site/data/meta.json
          cat _site/data/meta.json

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
